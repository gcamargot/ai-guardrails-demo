<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Outlook Untrusted Content containment</title>
  <desc id="desc">Synthetic terminal evidence showing a minimized read and zero derived effects.</desc>
  <rect width="1200" height="360" rx="18" fill="#111827"/>
  <text x="45" y="60" fill="#f9fafb" font-family="monospace" font-size="28">3 · OUTLOOK READ → UNTRUSTED CONTENT</text>
  <text x="45" y="120" fill="#34d399" font-family="monospace" font-size="23">read_message      outcome=allow    minimized=true</text>
  <text x="45" y="170" fill="#fbbf24" font-family="monospace" font-size="23">embedded content  authority=none   derived_effect_count=0</text>
  <text x="45" y="220" fill="#d1d5db" font-family="monospace" font-size="20">new explicit interaction required before any later Effect</text>
  <text x="45" y="265" fill="#93c5fd" font-family="monospace" font-size="19">trace_id=fallback-outlook-trace-03</text>
  <text x="45" y="300" fill="#93c5fd" font-family="monospace" font-size="19">correlation_id=fallback-outlook-correlation-03  decision_id=fallback-outlook-decision-03</text>
  <text x="45" y="335" fill="#9ca3af" font-family="monospace" font-size="17">policy_revision=ticket-10 · synthetic isolated evidence</text>
</svg>
