<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Meeting Proposal exact approval</title>
  <desc id="desc">Synthetic terminal evidence showing a proposal, exact approval and one idempotent event.</desc>
  <rect width="1200" height="360" rx="18" fill="#111827"/>
  <text x="45" y="60" fill="#f9fafb" font-family="monospace" font-size="28">2 · MEETING PROPOSAL → EXACT APPROVAL</text>
  <text x="45" y="120" fill="#fbbf24" font-family="monospace" font-size="23">proposal          state=pending    event_count=0</text>
  <text x="45" y="170" fill="#34d399" font-family="monospace" font-size="23">owner approval    exact+single-use event_count=1</text>
  <text x="45" y="220" fill="#d1d5db" font-family="monospace" font-size="20">retry             idempotent       event_count=1</text>
  <text x="45" y="265" fill="#93c5fd" font-family="monospace" font-size="19">trace_id=fallback-meeting-trace-02</text>
  <text x="45" y="300" fill="#93c5fd" font-family="monospace" font-size="19">correlation_id=fallback-meeting-correlation-02  decision_id=fallback-meeting-decision-02</text>
  <text x="45" y="335" fill="#9ca3af" font-family="monospace" font-size="17">policy_revision=ticket-10 · synthetic isolated evidence</text>
</svg>
