services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: demo-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: demo-admin-password
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://127.0.0.1:8082
    volumes:
      - ./keycloak/agent-tools-realm.json:/opt/keycloak/data/import/agent-tools-realm.json:ro
    networks:
      - identity
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"]
      interval: 3s
      timeout: 2s
      retries: 30

  oauth-facade:
    build: .
    command: /app/oauth-facade
    environment:
      OAUTH_BACKEND_URL: http://keycloak:8080
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8082"
    networks:
      - public
      - identity
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8082/healthz"]
      interval: 2s
      timeout: 1s
      retries: 15

  opa:
    image: openpolicyagent/opa:1.17.0-static
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --config-file=/config/opa.yaml
      - /policies/agent_tools.rego
    volumes:
      - ./policies/agent_tools.rego:/policies/agent_tools.rego:ro
      - ./policies/opa-config.yaml:/config/opa.yaml:ro
    networks:
      - control

  vault:
    image: hashicorp/vault:1.21.4
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: demo-vault-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    networks:
      - secrets
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 2s
      timeout: 2s
      retries: 20

  vault-init:
    image: hashicorp/vault:1.21.4
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: demo-vault-root-token
    entrypoint: /bin/sh
    volumes:
      - ./policies/vault:/config:ro
      - vault-tokens:/tokens
    command:
      - -ec
      - |
        vault policy write calendar-reader /config/calendar-reader.hcl >/dev/null
        vault policy write outlook-reader /config/outlook-reader.hcl >/dev/null
        vault policy write smart-lock-reader /config/smart-lock-reader.hcl >/dev/null
        vault kv put secret/calendar credential=demo-calendar-credential >/dev/null
        vault kv put secret/outlook credential=demo-outlook-credential >/dev/null
        vault kv put secret/smart-lock credential=demo-smart-lock-credential >/dev/null
        vault token create -field=token -policy=calendar-reader -policy=outlook-reader -policy=smart-lock-reader -no-default-policy > /tokens/gateway
        vault token create -field=token -policy=calendar-reader -no-default-policy > /tokens/calendar
        vault token create -field=token -policy=outlook-reader -no-default-policy > /tokens/outlook
        vault token create -field=token -policy=smart-lock-reader -no-default-policy > /tokens/smart-lock
    depends_on:
      vault:
        condition: service_healthy
    networks:
      - secrets

  coffee-station:
    build: .
    command: /app/coffee-station
    networks:
      - protected
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8081/healthz"]
      interval: 2s
      timeout: 1s
      retries: 15

  calendar:
    build: .
    command: /app/calendar
    environment:
      VAULT_TOKEN_FILE: /run/vault-token/calendar
      VAULT_URL: http://vault:8200
    depends_on:
      vault-init:
        condition: service_completed_successfully
    networks:
      - protected
      - secrets
      - observability
    volumes:
      - vault-tokens:/run/vault-token:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8083/healthz"]
      interval: 2s
      timeout: 1s
      retries: 15

  outlook:
    build: .
    command: /app/outlook
    environment:
      VAULT_TOKEN_FILE: /run/vault-token/outlook
      VAULT_URL: http://vault:8200
    depends_on:
      vault-init:
        condition: service_completed_successfully
    networks:
      - protected
      - secrets
    volumes:
      - vault-tokens:/run/vault-token:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8087/healthz"]
      interval: 2s
      timeout: 1s
      retries: 15

  development-repository:
    build: .
    command: /app/development-repository
    environment:
      REPOSITORY_DOCUMENT_FILE: /repository/CONTEXT.md
    volumes:
      - ./CONTEXT.md:/repository/CONTEXT.md:ro
    networks:
      - protected
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8090/healthz"]
      interval: 2s
      timeout: 1s
      retries: 15

  smart-lock:
    build: .
    command: /app/smart-lock
    environment:
      VAULT_TOKEN_FILE: /run/vault-token/smart-lock
      VAULT_URL: http://vault:8200
    depends_on:
      vault-init:
        condition: service_completed_successfully
    networks:
      - protected
      - secrets
      - observability
    volumes:
      - vault-tokens:/run/vault-token:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8088/healthz"]
      interval: 2s
      timeout: 1s
      retries: 15

  audit:
    build: .
    command: /app/audit
    networks:
      - audit
      - observability
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8089/healthz"]
      interval: 2s
      timeout: 1s
      retries: 15

  approval-state-init:
    image: alpine:3.22
    command: ["sh", "-c", "chown -R 10001:10001 /state"]
    volumes:
      - approval-state:/state
    networks:
      - approval

  approval-authority:
    build: .
    command: /app/approval-authority
    environment:
      APPROVAL_ISSUER_CREDENTIAL: demo-approval-service-credential
      APPROVAL_CONSUMER_CREDENTIAL: demo-approval-consumer-credential
      APPROVAL_SIGNING_KEY: demo-approval-signing-key-32-bytes-minimum
      APPROVAL_STATE_FILE: /state/consumed-nonces
      APPROVAL_TTL: 5s
      OWNER_SUBJECT: owner-subject-id
    networks:
      - approval
    volumes:
      - approval-state:/state
    depends_on:
      approval-state-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8086/healthz"]
      interval: 2s
      timeout: 1s
      retries: 15

  gateway:
    build: .
    command: /app/gateway
    environment:
      AUDIT_URL: http://audit:8089
      APPROVAL_AUTHORITY_URL: http://approval-authority:8086
      APPROVAL_CONSUMER_CREDENTIAL: demo-approval-consumer-credential
      AUTH_CHANNEL: streamable-http
      CALENDAR_URL: http://calendar:8083
      COFFEE_STATION_URL: http://coffee-station:8081
      DEVELOPMENT_REPOSITORY_URL: http://development-repository:8090
      OAUTH_AUTHORIZATION_SERVER: http://127.0.0.1:8082/realms/agent-tools
      OAUTH_METADATA_URL: http://127.0.0.1:8080/.well-known/oauth-protected-resource
      OAUTH_RESOURCE_URL: http://127.0.0.1:8080/mcp
      OAUTH_SCOPES: coffee_station.read,dev.repository.read
      OPA_URL: http://opa:8181
      OIDC_AUDIENCE: agent-tools-gateway
      OIDC_ISSUER: http://127.0.0.1:8082/realms/agent-tools
      OIDC_JWKS_URL: http://keycloak:8080/realms/agent-tools/protocol/openid-connect/certs
      OIDC_OPTIONAL_SCOPES: dev.repository.read,smart_lock.write
      OIDC_REQUIRED_SCOPES: coffee_station.read
      OUTLOOK_URL: http://outlook:8087
      SMART_LOCK_URL: http://smart-lock:8088
      VAULT_TOKEN_FILE: /run/vault-token/gateway
      VAULT_URL: http://vault:8200
    depends_on:
      audit:
        condition: service_healthy
      approval-authority:
        condition: service_healthy
      calendar:
        condition: service_healthy
      coffee-station:
        condition: service_healthy
      development-repository:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      opa:
        condition: service_started
      oauth-facade:
        condition: service_healthy
      outlook:
        condition: service_healthy
      smart-lock:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - public
      - control
      - identity
      - protected
      - secrets
      - approval
      - audit
    volumes:
      - vault-tokens:/run/vault-token:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 1s
      retries: 15

  telegram-gateway:
    build: .
    command: /app/gateway
    environment:
      AUDIT_URL: http://audit:8089
      APPROVAL_AUTHORITY_URL: http://approval-authority:8086
      APPROVAL_CONSUMER_CREDENTIAL: demo-approval-consumer-credential
      AUTH_CHANNEL: telegram
      CALENDAR_URL: http://calendar:8083
      COFFEE_STATION_URL: http://coffee-station:8081
      DEVELOPMENT_REPOSITORY_URL: http://development-repository:8090
      OAUTH_AUTHORIZATION_SERVER: http://127.0.0.1:8082/realms/agent-tools
      OAUTH_METADATA_URL: http://127.0.0.1:8080/.well-known/oauth-protected-resource
      OAUTH_RESOURCE_URL: http://127.0.0.1:8080/mcp
      OAUTH_SCOPES: dev.repository.read
      OPA_URL: http://opa:8181
      OIDC_AUDIENCE: agent-tools-gateway
      OIDC_ISSUER: http://127.0.0.1:8082/realms/agent-tools
      OIDC_JWKS_URL: http://keycloak:8080/realms/agent-tools/protocol/openid-connect/certs
      OIDC_OPTIONAL_SCOPES: calendar.meeting.approve,outlook.mail.read,smart_lock.write
      OIDC_REQUIRED_SCOPES: calendar.free_busy.read,calendar.meeting.propose
      OUTLOOK_URL: http://outlook:8087
      SMART_LOCK_URL: http://smart-lock:8088
      VAULT_TOKEN_FILE: /run/vault-token/gateway
      VAULT_URL: http://vault:8200
    depends_on:
      audit:
        condition: service_healthy
      approval-authority:
        condition: service_healthy
      calendar:
        condition: service_healthy
      coffee-station:
        condition: service_healthy
      development-repository:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      opa:
        condition: service_started
      oauth-facade:
        condition: service_healthy
      outlook:
        condition: service_healthy
      smart-lock:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    networks:
      - public
      - control
      - identity
      - protected
      - secrets
      - approval
      - audit
    volumes:
      - vault-tokens:/run/vault-token:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 1s
      retries: 15

  qwen:
    build: .
    command: /app/qwen-simulator
    networks:
      - model
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8085/healthz"]
      interval: 2s
      timeout: 1s
      retries: 15

  telegram-adapter:
    build: .
    command: /app/telegram-adapter
    environment:
      APPROVAL_AUTHORITY_URL: http://approval-authority:8086
      APPROVAL_ISSUER_CREDENTIAL: demo-approval-service-credential
      EXTERNAL_PASSWORD: external-demo-password
      EXTERNAL_SUBJECT: external-alice-subject-id
      EXTERNAL_USERNAME: external-alice
      GATEWAY_MCP_URL: http://telegram-gateway:8080/mcp
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/agent-tools/protocol/openid-connect/token
      OWNER_PASSWORD: owner-demo-password
      OWNER_SUBJECT: owner-subject-id
      OWNER_TELEGRAM_USER_ID: "9001"
      OWNER_USERNAME: owner
      QWEN_URL: http://qwen:8085
      TELEGRAM_OIDC_CLIENT_SECRET: telegram-demo-secret
      TELEGRAM_USER_ID: "4242"
      TELEGRAM_WEBHOOK_SECRET: demo-telegram-webhook-secret
    depends_on:
      approval-authority:
        condition: service_healthy
      qwen:
        condition: service_healthy
      telegram-gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:8084:8084"
    networks:
      - public
      - identity
      - model
      - approval
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8084/healthz"]
      interval: 2s
      timeout: 1s
      retries: 15

  smoke:
    build: .
    command: /app/smoke
    environment:
      AUDIT_RECORDS_URL: http://audit:8089/records
      CALENDAR_METRICS_URL: http://calendar:8083/metrics
      SMART_LOCK_METRICS_URL: http://smart-lock:8088/metrics
      GATEWAY_MCP_URL: http://gateway:8080/mcp
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/agent-tools/protocol/openid-connect/token
      TELEGRAM_GATEWAY_MCP_URL: http://telegram-gateway:8080/mcp
      TELEGRAM_WEBHOOK_URL: http://telegram-adapter:8084/telegram/webhook
    depends_on:
      gateway:
        condition: service_healthy
      telegram-adapter:
        condition: service_healthy
    networks:
      - public
      - identity
      - observability
      - audit
    profiles:
      - test

networks:
  public: {}
  control:
    internal: true
  identity:
    internal: true
  protected:
    internal: true
  secrets:
    internal: true
  model:
    internal: true
  approval:
    internal: true
  observability:
    internal: true
  audit:
    internal: true

volumes:
  vault-tokens: {}
  approval-state: {}
